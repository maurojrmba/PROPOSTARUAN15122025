<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proposta Orçamentária - MSJ Projetos</title>
    
    <!-- Carregando Tailwind CSS, React e Babel via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        /* Ajustes para ocultar a barra de rolagem mas manter funcionalidade */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        /* Animação suave */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fadeIn {
            animation: fadeIn 0.4s ease-out forwards;
        }

        /* Estilos específicos para Impressão (PDF) */
        @media print {
            .no-print {
                display: none !important;
            }
            body {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
                background-color: #fff7ed !important; /* bg-orange-50 */
            }
            .page-break {
                page-break-before: always;
            }
        }
    </style>
</head>
<body class="bg-orange-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // --- ÍCONES (SVG) ---
        const Icon = ({ children, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {children}
            </svg>
        );

        const FileText = ({ className }) => <Icon className={className}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></Icon>;
        const HardHat = ({ className }) => <Icon className={className}><path d="M12 2a5 5 0 0 0-5 5v2a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V7a5 5 0 0 0-5-5z"/><path d="M4 10a1 1 0 0 0-1 1v2a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1z"/><path d="M10 14v3"/><path d="M14 14v3"/></Icon>;
        const TrendingUp = ({ className }) => <Icon className={className}><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></Icon>;
        const Landmark = ({ className }) => <Icon className={className}><line x1="3" y1="22" x2="21" y2="22"/><line x1="6" y1="18" x2="6" y2="11"/><line x1="10" y1="18" x2="10" y2="11"/><line x1="14" y1="18" x2="14" y2="11"/><line x1="18" y1="18" x2="18" y2="11"/><polygon points="12 2 20 7 4 7"/></Icon>;
        const CheckCircle = ({ className }) => <Icon className={className}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></Icon>;
        const Calculator = ({ className }) => <Icon className={className}><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="16" y1="14" x2="16" y2="14"/><path d="M12 14h.01"/><path d="M8 14h.01"/><path d="M12 18h.01"/><path d="M8 18h.01"/><path d="M16 18h.01"/></Icon>;
        const AlertCircle = ({ className }) => <Icon className={className}><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></Icon>;
        const Wallet = ({ className }) => <Icon className={className}><path d="M20 12V8H6a2 2 0 0 1-2-2c0-1.1.9-2 2-2h12v4"/><path d="M4 6v12a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-2"/><circle cx="12" cy="14" r="2"/></Icon>;
        const MapPin = ({ className }) => <Icon className={className}><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></Icon>;
        const Phone = ({ className }) => <Icon className={className}><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></Icon>;
        const Mail = ({ className }) => <Icon className={className}><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></Icon>;

        // --- COMPONENTE PRINCIPAL ---
        const ProposalMSJ = () => {
            const [activeTab, setActiveTab] = useState('resumo');

            // Dados do Cliente e Financiamento
            const clientName = "BIG VARIEDADE";
            const clientCNPJ = "39.704.303/0001-20";
            const financingTotal = 1000000;
            const civilWorks = 700000;
            const workingCapital = 300000;
            
            // Custos Fixos e Variáveis
            const costProjectsEngineering = 9000; // Valor atualizado para 9 mil
            const costPermits = 8000;
            const costEconomicProject = financingTotal * 0.05; // 5% (Total 50k)
            const costBankAnalysisMin = 7000;
            const costBankAnalysisMax = 10000;
            const costRegistry = 13000;
            
            // Entradas e Parcelamentos
            const entryMSJ = costProjectsEngineering * 0.5; // 50%
            const deliveryMSJ = costProjectsEngineering * 0.5; // 50%
            const entryAcao = 10000; // Entrada Fixa
            
            // Total gasto antes da liberação (Estimativa média)
            const totalPreRelease = costProjectsEngineering + costPermits + costEconomicProject + ((costBankAnalysisMin + costBankAnalysisMax) / 2);

            // Custos da Obra
            const constructionCosts = [
                { item: "Fundação", value: 80000 },
                { item: "Estrutura Pré-Moldada", value: 250000 },
                { item: "Alvenaria de Fechamento", value: 90000 },
                { item: "Piso e Contrapiso Interno", value: 70000 },
                { item: "Laje do Empreendimento", value: 45000 },
                { item: "Cobertura", value: 55000 },
                { item: "Fachada (ACM e Pele de Vidro)", value: 40000 },
                { item: "Instalações Elétricas", value: 15000 },
                { item: "Instalações Hidráulicas", value: 15000 },
            ];

            const totalConstructionDirect = constructionCosts.reduce((acc, curr) => acc + curr.value, 0);

            const formatCurrency = (value) => {
                return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(value);
            };

            return (
                <div className="min-h-screen bg-orange-50 font-sans text-slate-800 flex flex-col">
                {/* Header com Logo e Cor Laranja */}
                <header className="bg-orange-600 text-white p-4 md:p-6 shadow-lg border-b-4 border-orange-700">
                    <div className="max-w-5xl mx-auto flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div className="flex items-center gap-4">
                            {/* LOGO DA EMPRESA */}
                            <div className="bg-white p-1 rounded-lg shadow-sm">
                                <img 
                                    src="FUNDO MSJ BRANCO E LARANJA.jpg" 
                                    alt="Logo MSJ" 
                                    className="h-16 w-auto object-contain"
                                    onError={(e) => {
                                        e.target.style.display = 'none'; // Esconde se não encontrar
                                        e.target.parentNode.innerHTML = '<div class="h-16 w-16 flex items-center justify-center bg-orange-100 text-orange-600 font-bold rounded">MSJ</div>'; // Fallback
                                    }}
                                />
                            </div>
                            <div>
                                <h1 className="text-xl md:text-2xl font-bold tracking-wider text-white leading-tight">MSJ PROJETOS</h1>
                                <p className="text-orange-100 text-xs md:text-sm font-medium">Assessoria e Fomento</p>
                                <div className="flex items-center gap-1 mt-1 text-orange-200 text-[10px] md:text-xs">
                                    <MapPin className="w-3 h-3" />
                                    <span>Marabá - PA</span>
                                </div>
                            </div>
                        </div>
                        
                        <div className="w-full md:w-auto mt-2 md:mt-0 pt-2 md:pt-0 border-t border-orange-500 md:border-0 md:text-right flex justify-between md:block items-center">
                            <div>
                                <p className="text-xs text-orange-200">Proposta para:</p>
                                <h2 className="font-semibold text-sm md:text-base text-white">{clientName}</h2>
                            </div>
                            <p className="text-[10px] md:text-xs font-mono opacity-90 bg-orange-700 px-2 py-1 rounded md:bg-transparent md:p-0 text-orange-100 ml-2 md:ml-0">
                                CNPJ: {clientCNPJ}
                            </p>
                        </div>
                    </div>
                </header>

                {/* Navigation (Oculto na Impressão) */}
                <nav className="bg-white shadow sticky top-0 z-20 no-print">
                    <div className="max-w-5xl mx-auto flex overflow-x-auto hide-scrollbar snap-x">
                    <button 
                        onClick={() => setActiveTab('resumo')}
                        className={`flex-none snap-start py-3 px-5 font-medium text-sm whitespace-nowrap border-b-2 transition-colors ${activeTab === 'resumo' ? 'border-orange-600 text-orange-600 bg-orange-50' : 'border-transparent text-slate-500 hover:text-orange-800'}`}
                    >
                        Visão Geral
                    </button>
                    <button 
                        onClick={() => setActiveTab('fluxograma')}
                        className={`flex-none snap-start py-3 px-5 font-medium text-sm whitespace-nowrap border-b-2 transition-colors ${activeTab === 'fluxograma' ? 'border-orange-600 text-orange-600 bg-orange-50' : 'border-transparent text-slate-500 hover:text-orange-800'}`}
                    >
                        Fluxograma
                    </button>
                    <button 
                        onClick={() => setActiveTab('engenharia')}
                        className={`flex-none snap-start py-3 px-5 font-medium text-sm whitespace-nowrap border-b-2 transition-colors ${activeTab === 'engenharia' ? 'border-orange-600 text-orange-600 bg-orange-50' : 'border-transparent text-slate-500 hover:text-orange-800'}`}
                    >
                        Projetos & Taxas
                    </button>
                    <button 
                        onClick={() => setActiveTab('obra')}
                        className={`flex-none snap-start py-3 px-5 font-medium text-sm whitespace-nowrap border-b-2 transition-colors ${activeTab === 'obra' ? 'border-orange-600 text-orange-600 bg-orange-50' : 'border-transparent text-slate-500 hover:text-orange-800'}`}
                    >
                        Obra
                    </button>
                    </div>
                </nav>

                <main className="max-w-5xl mx-auto p-3 md:p-6 flex-grow w-full">
                    
                    {/* TAB: VISÃO GERAL */}
                    {/* Na impressão, removemos a verificação de aba para mostrar tudo ou mantemos apenas a atual? 
                        Para gerar PDF, geralmente queremos ver o que está na tela. O usuário pode imprimir aba por aba ou podemos fazer um botão "Ver Tudo". 
                        Vou manter o comportamento de tela: imprime o que está visível. */}
                    
                    {activeTab === 'resumo' && (
                    <div className="space-y-4 md:space-y-6 animate-fadeIn">
                        
                        <div className="bg-orange-100 border-l-4 border-orange-500 p-3 md:p-4 rounded-r shadow-sm">
                        <div className="flex items-start">
                            <AlertCircle className="w-5 h-5 text-orange-600 mr-2 flex-shrink-0 mt-0.5" />
                            <div>
                            <h3 className="font-bold text-orange-800 text-xs md:text-sm uppercase mb-1">Atenção: Valores Aproximados</h3>
                            <p className="text-xs md:text-sm text-orange-900 leading-relaxed">
                                Estimativas baseadas em custos médios. Confirmação exata depende da conclusão dos projetos de engenharia.
                            </p>
                            </div>
                        </div>
                        </div>

                        <div className="bg-white p-4 md:p-8 rounded-xl shadow-sm border border-orange-200">
                        <h2 className="text-xl md:text-2xl font-bold text-slate-800 mb-3 md:mb-4 border-b pb-2 border-orange-100">Apresentação de Proposta</h2>
                        <p className="text-sm md:text-base text-slate-600 mb-6 leading-relaxed">
                            Nós, MSJ Projetos e Fomento, juntamente com a Ação Projetos, estamos apresentando a proposta orçamentária. A MSJ é uma empresa constituída na cidade de Marabá, onde prestamos serviços de construção, reformas, ampliação, projetos de engenharia e assessorias com captação de recursos para empresas.
                        </p>

                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 md:gap-4 mb-6 md:mb-8">
                            <div className="bg-orange-50 p-3 md:p-4 rounded-lg border border-orange-200 flex justify-between sm:block items-center">
                            <span className="text-orange-600 text-xs md:text-sm font-semibold uppercase">Obras Civis</span>
                            <p className="text-lg md:text-2xl font-bold text-slate-800">{formatCurrency(civilWorks)}</p>
                            </div>
                            <div className="bg-slate-50 p-3 md:p-4 rounded-lg border border-slate-200 flex justify-between sm:block items-center">
                            <span className="text-slate-600 text-xs md:text-sm font-semibold uppercase">Giro/Equip.</span>
                            <p className="text-lg md:text-2xl font-bold text-slate-800">{formatCurrency(workingCapital)}</p>
                            </div>
                            <div className="bg-slate-800 p-3 md:p-4 rounded-lg border border-slate-700 text-white flex justify-between sm:block items-center shadow-lg sm:shadow-none">
                            <span className="text-slate-300 text-xs md:text-sm font-semibold uppercase">Total Financiado</span>
                            <p className="text-lg md:text-2xl font-bold">{formatCurrency(financingTotal)}</p>
                            </div>
                        </div>

                        <div className="bg-orange-700 rounded-xl p-4 md:p-6 text-white mb-4 md:mb-6 shadow-lg border border-orange-800">
                            <div className="flex flex-col sm:flex-row items-start gap-3 md:gap-4">
                            <div className="hidden sm:block bg-orange-600 p-3 rounded-full">
                                <Wallet className="w-8 h-8 text-white" />
                            </div>
                            <div className="flex-1 w-full">
                                <div className="flex items-center gap-2 mb-2">
                                <Wallet className="w-5 h-5 text-white sm:hidden" />
                                <h3 className="text-lg md:text-xl font-bold text-white">Investimento Inicial</h3>
                                </div>
                                <p className="text-xs md:text-base text-orange-100 mb-4 leading-relaxed">
                                Aporte necessário para início das etapas de Engenharia e Estruturação:
                                </p>
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 md:gap-4 bg-orange-800/40 p-3 md:p-4 rounded-lg border border-orange-600">
                                <div className="flex justify-between sm:block border-b border-orange-600/50 sm:border-0 pb-2 sm:pb-0">
                                    <p className="text-[10px] md:text-xs uppercase font-semibold text-orange-200">50% MSJ (Entrada)</p>
                                    <p className="text-lg md:text-2xl font-bold">{formatCurrency(entryMSJ)}</p>
                                </div>
                                <div className="flex justify-between sm:block">
                                    <p className="text-[10px] md:text-xs uppercase font-semibold text-orange-200">Entrada Ação Projetos</p>
                                    <div className="flex items-center sm:items-baseline gap-2">
                                        <p className="text-lg md:text-2xl font-bold">{formatCurrency(entryAcao)}</p>
                                        <span className="text-[10px] md:text-sm text-orange-200 font-medium">(Entrada)</span>
                                    </div>
                                </div>
                                <div className="col-span-1 sm:col-span-2 pt-2 border-t border-orange-600/50 mt-1">
                                    <div className="flex justify-between items-center">
                                    <span className="text-sm md:font-semibold text-white">Total Imediato:</span>
                                    <span className="text-xl md:text-2xl font-bold text-white">{formatCurrency(entryMSJ + entryAcao)}</span>
                                    </div>
                                    <p className="text-[10px] text-orange-200 mt-2 text-center leading-tight">
                                    *Valores para início. Engenharia quitada na entrega. Projeto Econômico (saldo) na 1ª parcela.
                                    </p>
                                </div>
                                </div>
                            </div>
                            </div>
                        </div>

                        <div className="flex items-start bg-slate-100 p-3 md:p-4 rounded-lg border border-slate-200">
                            <AlertCircle className="w-5 h-5 text-slate-600 mr-2 flex-shrink-0 mt-0.5" />
                            <div>
                            <h4 className="font-semibold text-sm md:text-base text-slate-800">Custo Total Estimado</h4>
                            <p className="text-xs md:text-sm text-slate-700 mt-1">
                                Para financiar <strong>{formatCurrency(financingTotal)}</strong>, o custo total estimado (projetos + taxas) é de <strong>{formatCurrency(totalPreRelease)}</strong>. O valor de entrada já compõe este total.
                            </p>
                            </div>
                        </div>
                        </div>
                    </div>
                    )}

                    {/* TAB: FLUXOGRAMA */}
                    {activeTab === 'fluxograma' && (
                    <div className="space-y-6 md:space-y-8 animate-fadeIn">
                        <div className="bg-white p-4 md:p-6 rounded-xl shadow-sm border border-orange-200">
                        <h3 className="text-lg md:text-xl font-bold mb-6 flex items-center gap-2 text-orange-700">
                            <TrendingUp className="w-5 h-5" />
                            Fluxo de Processos
                        </h3>
                        
                        <div className="relative border-l-4 border-orange-200 ml-3 md:ml-6 space-y-8 md:space-y-12 py-2">
                            
                            {/* Step 1 */}
                            <div className="relative pl-6 md:pl-8">
                            <div className="absolute -left-[9px] md:-left-3.5 top-0 w-5 h-5 md:w-7 md:h-7 bg-orange-600 rounded-full border-2 md:border-4 border-white"></div>
                            <div className="bg-orange-50 p-3 md:p-4 rounded-lg border border-orange-200 shadow-sm">
                                <div className="flex justify-between items-start flex-wrap gap-2">
                                <h4 className="font-bold text-base md:text-lg text-slate-800">1. Contratação e Início</h4>
                                <span className="bg-green-100 text-green-800 text-[10px] font-bold px-2 py-1 rounded border border-green-200">Pagto. Inicial</span>
                                </div>
                                <p className="text-xs md:text-sm text-slate-600 mt-2">Pagamento das entradas para início dos trabalhos.</p>
                                <div className="mt-3 bg-white p-2 md:p-3 rounded border border-orange-100">
                                    <div className="flex justify-between text-xs md:text-sm mb-1">
                                        <span className="text-slate-500">Entrada MSJ (50%):</span>
                                        <span className="font-bold text-slate-700">{formatCurrency(entryMSJ)}</span>
                                    </div>
                                    <div className="flex justify-between text-xs md:text-sm">
                                        <span className="text-slate-500">Entrada Ação:</span>
                                        <span className="font-bold text-slate-700">{formatCurrency(entryAcao)}</span>
                                    </div>
                                </div>
                            </div>
                            </div>

                            {/* Step 2 */}
                            <div className="relative pl-6 md:pl-8">
                            <div className="absolute -left-[9px] md:-left-3.5 top-0 w-5 h-5 md:w-7 md:h-7 bg-orange-400 rounded-full border-2 md:border-4 border-white"></div>
                            <div className="bg-white p-3 md:p-4 rounded-lg border border-slate-200 shadow-sm">
                                <h4 className="font-bold text-base md:text-lg text-slate-800">2. Entrega dos Projetos</h4>
                                <p className="text-xs md:text-sm text-slate-600 mt-2">Finalização dos projetos técnicos.</p>
                                <div className="mt-2 flex flex-col md:flex-row md:items-center justify-between text-xs md:text-sm font-medium border-t pt-2 gap-1">
                                <span className="text-slate-500">Destino: <strong className="text-orange-700">MSJ Projetos</strong></span>
                                <span className="text-red-600">Restante {formatCurrency(deliveryMSJ)}</span>
                                </div>
                            </div>
                            </div>

                            {/* Step 3 */}
                            <div className="relative pl-6 md:pl-8">
                            <div className="absolute -left-[9px] md:-left-3.5 top-0 w-5 h-5 md:w-7 md:h-7 bg-slate-500 rounded-full border-2 md:border-4 border-white"></div>
                            <div className="bg-white p-3 md:p-4 rounded-lg border border-slate-200 shadow-sm">
                                <h4 className="font-bold text-base md:text-lg text-slate-800">3. Legalização</h4>
                                <p className="text-xs md:text-sm text-slate-600 mt-2">Taxas e alvarás.</p>
                                <div className="mt-2 flex items-center justify-between text-xs md:text-sm font-medium border-t pt-2">
                                <span className="text-slate-500">Destino: <strong className="text-slate-700">Prefeitura</strong></span>
                                <span className="text-red-600">~ {formatCurrency(costPermits)}</span>
                                </div>
                            </div>
                            </div>

                            {/* Step 4 */}
                            <div className="relative pl-6 md:pl-8">
                            <div className="absolute -left-[9px] md:-left-3.5 top-0 w-5 h-5 md:w-7 md:h-7 bg-slate-700 rounded-full border-2 md:border-4 border-white"></div>
                            <div className="bg-white p-3 md:p-4 rounded-lg border border-slate-200 shadow-sm">
                                <h4 className="font-bold text-base md:text-lg text-slate-800">4. Análise Bancária</h4>
                                <p className="text-xs md:text-sm text-slate-600 mt-2">Taxa de análise do Banco da Amazônia.</p>
                                <div className="mt-2 flex items-center justify-between text-xs md:text-sm font-medium border-t pt-2">
                                <span className="text-slate-500">Valor Estimado:</span>
                                <span className="text-red-600 font-bold">~ 1% do financiado</span>
                                </div>
                            </div>
                            </div>

                            {/* Step 5 */}
                            <div className="relative pl-6 md:pl-8">
                            <div className="absolute -left-[9px] md:-left-3.5 top-0 w-5 h-5 md:w-7 md:h-7 bg-green-600 rounded-full border-2 md:border-4 border-white"></div>
                            <div className="bg-green-100 p-3 md:p-4 rounded-lg border border-green-300 shadow-md">
                                <div className="flex items-center gap-2">
                                <CheckCircle className="w-5 h-5 text-green-700" />
                                <h4 className="font-bold text-base md:text-lg text-green-900">5. Aprovação e Liberação</h4>
                                </div>
                                <p className="text-xs md:text-sm text-green-800 mt-2">Quitação da Ação Projetos (descontando entrada).</p>
                                <div className="mt-2 text-[10px] md:text-xs text-green-800 font-mono bg-green-50 p-2 rounded">
                                    Saldo = (5% Total) - (10k Entrada)
                                </div>
                            </div>
                            </div>

                        </div>
                        </div>
                    </div>
                    )}

                    {/* TAB: PROJETOS E TAXAS */}
                    {activeTab === 'engenharia' && (
                    <div className="space-y-4 md:space-y-6 animate-fadeIn">
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-6">
                            
                            {/* MSJ Card */}
                            <div className="bg-white p-4 md:p-6 rounded-xl shadow-sm border border-orange-200 flex flex-col">
                            <div className="flex items-center gap-3 mb-4">
                                <div className="p-2 md:p-3 bg-orange-100 rounded-full">

                                </div>
                                <div>
                                    <h3 className="font-bold text-base md:text-lg text-orange-800">Projetos de Engenharia</h3>
                                    <p className="text-[10px] md:text-xs text-slate-500">Pagamento à MSJ Projetos</p>
                                </div>
                            </div>
                            <ul className="space-y-2 mb-6 flex-1">
                                {['Projeto Arquitetônico', 'Projeto Elétrico', 'Aterramento e SPDA', 'Projeto Hidráulico', 'Combate a Incêndio'].map((item, i) => (
                                    <li key={i} className="flex items-center text-xs md:text-sm text-slate-600">
                                    <CheckCircle className="w-3 h-3 md:w-4 md:h-4 text-green-500 mr-2 flex-shrink-0" />
                                    {item}
                                    </li>
                                ))}
                            </ul>
                            <div className="bg-orange-50 p-3 md:p-4 rounded-lg border border-orange-100 mt-auto">
                                <p className="text-[10px] font-bold text-slate-500 uppercase mb-2">Forma de Pagamento</p>
                                <div className="flex justify-between items-center mb-2">
                                    <span className="text-xs md:text-sm text-slate-700">Entrada:</span>
                                    <span className="font-bold text-orange-700 text-sm md:text-base">{formatCurrency(entryMSJ)}</span>
                                </div>
                                <div className="flex justify-between items-center border-t border-orange-200 pt-2">
                                    <span className="text-xs md:text-sm text-slate-700">Na Entrega:</span>
                                    <span className="font-bold text-orange-700 text-sm md:text-base">{formatCurrency(deliveryMSJ)}</span>
                                </div>
                            </div>
                            </div>

                            {/* Ação Projetos Card */}
                            <div className="bg-white p-4 md:p-6 rounded-xl shadow-sm border border-slate-200 flex flex-col">

                                <div className="p-2 md:p-3 bg-green-100 rounded-full">
                                    <Calculator className="w-5 h-5 md:w-6 md:h-6 text-green-600" />
                                </div>
                                <div>
                                    <h3 className="font-bold text-base md:text-lg">Projeto Econômico</h3>
                                    <p className="text-[10px] md:text-xs text-slate-500">Pagamento à Ação Projetos</p>
                                </div>
                            </div>
                            
                            <div className="bg-green-50 border border-green-100 p-3 md:p-4 rounded-lg mb-4 flex-1">
                                <h4 className="font-bold text-green-800 text-xs md:text-sm mb-2">Cálculo de Compensação</h4>
                                <p className="text-[10px] md:text-xs text-green-700 mb-3 leading-tight">
                                    Entrada de 10k é abatida do valor final (5%).
                                </p>
                                
                                <div className="space-y-2 text-xs md:text-sm font-mono bg-white/60 p-2 rounded">
                                    <div className="flex justify-between">
                                        <span>Total (5%):</span>
                                        <span>{formatCurrency(costEconomicProject)}</span>
                                    </div>
                                    <div className="flex justify-between text-red-600">
                                        <span>(-) Entrada:</span>
                                        <span>{formatCurrency(entryAcao)}</span>
                                    </div>
                                    <div className="flex justify-between font-bold text-green-800 border-t border-green-300 pt-1">
                                        <span>Saldo Final:</span>
                                        <span>{formatCurrency(costEconomicProject - entryAcao)}</span>
                                    </div>
                                </div>
                                <p className="text-[9px] md:text-[10px] text-green-600 mt-2 text-center">
                                    *Pago na liberação do recurso.
                                </p>
                            </div>
                            </div>

                            {/* Avaliação MSJ */}
                            <div className="bg-white p-4 md:p-6 rounded-xl shadow-sm border border-slate-200">
                            <div className="flex items-center gap-3 mb-4">
                                <div className="p-2 md:p-3 bg-slate-100 rounded-full">
                                    <Landmark className="w-5 h-5 md:w-6 md:h-6 text-slate-600" />
                                </div>
                                <div>
                                    <h3 className="font-bold text-base md:text-lg">Avaliação Imobiliária</h3>
                                    <p className="text-[10px] md:text-xs text-slate-500">Pagamento à MSJ Projetos</p>
                                </div>
                            </div>
                            <div className="pt-2 border-t flex justify-between items-center">
                                <span className="text-xs md:text-sm font-semibold text-slate-700">Taxa sobre valor</span>
                                <span className="font-bold text-lg text-slate-700">0,5%</span>
                            </div>
                            </div>

                        </div>
                    </div>
                    )}

                    {/* TAB: ESTIMATIVA DE OBRA */}
                    {activeTab === 'obra' && (
                    <div className="space-y-6 animate-fadeIn">
                        <div className="bg-white rounded-xl shadow-sm border border-orange-200 overflow-hidden">
                        <div className="p-4 md:p-6 border-b border-orange-100 flex flex-col sm:flex-row justify-between items-start sm:items-center bg-orange-50 gap-2">
                            <div className="flex items-center gap-3">
                            <HardHat className="w-5 h-5 md:w-6 md:h-6 text-orange-600" />
                            <h3 className="font-bold text-base md:text-lg text-slate-800">Custos Diretos de Obra</h3>
                            </div>
                            <span className="text-[10px] md:text-xs font-semibold bg-orange-100 text-orange-800 px-3 py-1 rounded-full">Fase de Execução</span>
                        </div>
                        
                        <div className="overflow-x-auto">
                            <table className="w-full text-left text-xs md:text-sm text-slate-600 min-w-[500px]">
                            <thead className="bg-orange-50 text-[10px] md:text-xs uppercase text-slate-500 font-semibold">
                                <tr>
                                <th className="px-4 md:px-6 py-3 md:py-4">Etapa</th>
                                <th className="px-4 md:px-6 py-3 md:py-4 text-right">Valor</th>
                                <th className="px-4 md:px-6 py-3 md:py-4 text-right">%</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-orange-100">
                                {constructionCosts.map((item, index) => (
                                <tr key={index} className="hover:bg-orange-50 transition-colors">
                                    <td className="px-4 md:px-6 py-3 md:py-4 font-medium text-slate-800">{item.item}</td>
                                    <td className="px-4 md:px-6 py-3 md:py-4 text-right font-mono">{formatCurrency(item.value)}</td>
                                    <td className="px-4 md:px-6 py-3 md:py-4 text-right">
                                    {((item.value / totalConstructionDirect) * 100).toFixed(1)}%
                                    </td>
                                </tr>
                                ))}
                            </tbody>
                            <tfoot className="bg-orange-50 font-bold text-slate-800">
                                <tr>
                                <td className="px-4 md:px-6 py-3 md:py-4 text-xs uppercase">Total Listado</td>
                                <td className="px-4 md:px-6 py-3 md:py-4 text-right text-orange-700">{formatCurrency(totalConstructionDirect)}</td>
                                <td className="px-4 md:px-6 py-3 md:py-4 text-right">100%</td>
                                </tr>
                            </tfoot>
                            </table>
                        </div>
                        
                        <div className="p-4 bg-orange-50 text-[10px] md:text-xs text-orange-800 border-t border-orange-100">
                            <p><strong>Nota:</strong> A diferença para o total financiado ({formatCurrency(civilWorks)}) será para custos indiretos/margem.</p>
                        </div>
                        </div>
                    </div>
                    )}

                </main>

                {/* FOOTER */}
                <footer className="bg-slate-800 text-slate-300 py-8 mt-auto border-t-4 border-orange-600 print:bg-white print:text-slate-800 print:border-t-2">
                    <div className="max-w-5xl mx-auto px-6">
                        <div className="grid md:grid-cols-3 gap-8">
                            <div>
                                <h4 className="text-white font-bold text-lg mb-2 print:text-orange-700">MSJ PROJETOS</h4>
                                <p className="text-sm opacity-80 mb-4">Assessoria e Fomento</p>
                                <p className="text-xs leading-relaxed mb-4">
                                    Soluções completas em Engenharia, Construção Civil e Captação de Recursos Financeiros para alavancar o seu negócio.
                                </p>
                                <p className="text-xs font-mono text-orange-400">CNPJ: 61.879.020/0001-79</p>
                            </div>
                            <div>
                                <h4 className="text-white font-bold text-sm uppercase mb-3 print:text-orange-700">Serviços</h4>
                                <ul className="text-xs space-y-1">
                                    <li>• Projetos de Engenharia</li>
                                    <li>• Construção e Reformas</li>
                                    <li>• Ampliações</li>
                                    <li>• Consultoria Financeira</li>
                                    <li>• Viabilidade Econômica</li>
                                </ul>
                            </div>
                            <div>
                                <h4 className="text-white font-bold text-sm uppercase mb-3 print:text-orange-700">Contato</h4>
                                <div className="space-y-2 text-xs">
                                    <div className="flex items-center gap-2">
                                        <MapPin className="w-4 h-4 text-orange-500" />
                                        <span>Marabá - PA</span>
                                    </div>
                                    <div className="flex items-center gap-2">
                                        <Phone className="w-4 h-4 text-orange-500" />
                                        <span>(94) 9 81950028</span>
                                    </div>
                                    <div className="flex items-center gap-2">
                                        <Mail className="w-4 h-4 text-orange-500" />
                                        <span className="break-all">MJPARAPROJETO@GMAIL.COM</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div className="border-t border-slate-700 mt-8 pt-4 text-center text-[10px] opacity-60 print:border-slate-200">
                            &copy; {new Date().getFullYear()} MSJ Projetos e Assessoria e Fomento. Todos os direitos reservados.
                        </div>
                    </div>
                </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ProposalMSJ />);
    </script>
</body>
